services:
  - type: web
    name: maui-revenue-radar-api
    env: production
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT}

builds:
  - name: maui-revenue-radar-api
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: POSTGRES_PASSWORD
        value: "${POSTGRES_PASSWORD}"
      - key: DATABASE_URL
        value: "postgres://localhost:5432/maui_revenue_radar"
      - key: PORT
        value: "8000"

webBuilds:
  - name: maui-revenue-radar-api
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: POSTGRES_PASSWORD
        value: "${POSTGRES_PASSWORD}"
      - key: DATABASE_URL
        value: "postgres://localhost:5432/maui_revenue_radar"
      - key: PORT
        value: "8000"

# Environment Variables for Production Deployment
envVars:
  - name: FASTAPI_ENV
    value: production
  - name: POSTGRES_URL
    value: postgres://user@localhost:5432/maui_revenue_radar